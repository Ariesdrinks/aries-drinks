<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aries Drinks - Local</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 15px; margin-bottom: 15px; }
        .header img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; border: 2px solid white; }
        .header h1 { font-size: 20px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { flex: 1; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 14px; text-align: center; background: #ddd; color: #666; border: none; }
        .tab.activa { background: #e74c3c; color: white; }
        .seccion { display: none; }
        .seccion.activa { display: block; }
        .busqueda { margin-bottom: 10px; }
        .busqueda input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; font-size: 15px; }
        .categoria { background: white; margin-bottom: 8px; border-radius: 10px; overflow: hidden; }
        .categoria-titulo { background: #e74c3c; color: white; padding: 12px 15px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .categoria.abierta .categoria-contenido { display: block; }
        .categoria-contenido { display: none; }
        .subcategoria-titulo { background: #fdf2f2; padding: 8px 15px; font-size: 13px; font-weight: bold; color: #c0392b; cursor: pointer; }
        .subcategoria.abierta .subcategoria-productos { display: block; }
        .subcategoria-productos { display: none; padding: 5px 10px; }
        .producto { display: flex; align-items: center; padding: 6px 5px; border-bottom: 1px solid #f5f5f5; gap: 8px; }
        .producto.agotado { opacity: 0.4; }
        .producto-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .producto-info { flex: 1; }
        .producto-nombre { font-weight: bold; font-size: 13px; }
        .producto-precio { color: #e74c3c; font-weight: bold; font-size: 13px; }
        .producto-stock { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
        .stock-disponible { background: #d4edda; color: #155724; }
        .stock-bajo { background: #fff3cd; color: #856404; }
        .stock-agotado { background: #f8d7da; color: #721c24; }
        .cantidad-control { display: flex; align-items: center; gap: 4px; }
        .btn-cant { background: #e74c3c; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; cursor: pointer; }
        .btn-cant:disabled { background: #ccc; }
        .cantidad { min-width: 15px; text-align: center; font-weight: bold; font-size: 12px; }
        .box { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; }
        .box h3 { color: #2c3e50; margin-bottom: 10px; font-size: 16px; border-bottom: 2px solid #e74c3c; padding-bottom: 5px; }
        .total-grande { font-size: 28px; font-weight: bold; color: #e74c3c; text-align: right; }
        .pago-opcion { display: inline-block; padding: 10px 20px; border: 2px solid #ddd; border-radius: 10px; margin: 5px; cursor: pointer; }
        .pago-opcion.seleccionado { border-color: #e74c3c; background: #fdf2f2; }
        .pago-opcion input { display: none; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 8px; }
        .btn-accion { width: 100%; padding: 15px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        .btn-cobrar { background: #27ae60; color: white; }
        .btn-confirmar { background: #2980b9; color: white; }
        .btn-rojo { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; border: none; }
        .vuelto { background: #d4edda; padding: 10px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #155724; margin-top: 8px; }
        .pendiente-item { background: #fff9e6; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #f39c12; }
        .caja-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .caja-total { font-size: 20px; font-weight: bold; text-align: right; padding: 10px; }
        .historial-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; justify-content: space-between; }
        .detalle-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.jpeg" alt="Aries Drinks" onerror="this.style.display='none'">
            <h1>🏪 ARIES DRINKS</h1>
            <p>Venta Local</p>
        </div>
        <div class="tabs">
            <button class="tab activa" onclick="cambiarTab('venta')">💰 Vender</button>
            <button class="tab" onclick="cambiarTab('canje')">🎫 Canjear</button>
            <button class="tab" onclick="cambiarTab('caja')">📊 Caja</button>
        </div>
        <div id="seccionVenta" class="seccion activa">
            <div class="busqueda">
                <input type="text" id="buscarProdLocal" placeholder="🔍 Buscar producto..." oninput="filtrarProductosLocal()">
            </div>
            <div id="productosVenta"></div>
            <div class="box">
                <h3>🛒 DETALLE DE VENTA</h3>
                <div id="detalleVenta" style="margin-bottom:10px;">
                    <p style="color:#999;text-align:center;padding:10px;">Sin productos</p>
                </div>
                <div class="total-grande">Total: $<span id="totalVenta">0</span></div>
            </div>
            <div class="box">
                <h3>💳 MEDIO DE PAGO</h3>
                <label class="pago-opcion seleccionado" onclick="seleccionarPago('efectivo', this)"><input type="radio" name="pagoLocal" value="efectivo" checked> 💵 Efectivo</label>
                <label class="pago-opcion" onclick="seleccionarPago('transferencia', this)"><input type="radio" name="pagoLocal" value="transferencia"> 🏦 Transferencia</label>
                <div id="pagoEfectivoBox"><input type="number" id="montoPagoLocal" placeholder="¿Con cuánto paga?"><div class="vuelto" id="vueltoLocal">Vuelto: $0</div></div>
            </div>
            <button class="btn-accion btn-cobrar" id="btnCobrar" disabled onclick="cobrarVenta()">✅ COBRAR Y DESCONTAR STOCK</button>
        </div>
        <div id="seccionCanje" class="seccion">
            <div class="box"><h3>🎫 PEDIDOS PENDIENTES</h3><div id="listaPendientes"><p style="color:#999;text-align:center;padding:20px;">No hay pedidos pendientes</p></div></div>
        </div>
        <div id="seccionCaja" class="seccion">
            <div class="box"><h3>📊 CAJA DEL DÍA</h3>
                <div class="caja-item"><span>💵 Efectivo:</span><strong>$<span id="cajaEfectivo">0</span></strong></div>
                <div class="caja-item"><span>🏦 Transferencia:</span><strong>$<span id="cajaTransferencia">0</span></strong></div>
                <div class="caja-total">💰 TOTAL: $<span id="cajaTotal">0</span></div>
            </div>
            <div class="box"><h3>📋 ÚLTIMAS VENTAS</h3><div id="listaHistorial"><p style="color:#999;text-align:center;padding:20px;">Sin ventas</p></div></div>
            <div class="box" style="margin-top:10px;">
                <h3>📚 LIBRO DE CAJA (NUBE)</h3>
                <div id="listaLibroCaja"><p style="color:#999;text-align:center;padding:10px;">Cargando...</p></div>
            </div>
            <button class="btn-accion btn-rojo" style="padding:12px;" onclick="reiniciarCaja()">🔄 REINICIAR CAJA (Forzar nuevo día)</button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwq-AgewPBm93mXS-vhbRApJMcpoyFt8jsz8XM-XzfFq-E2_Qri1AgLy7JYRESLpEbc1w/exec';
        
        let carritoLocal = {};
        let productosSheet = [];
        let stockActual = {};
        let cajaEfectivo = 0;
        let cajaTransferencia = 0;
        let historialLocal = [];
        let pagoSeleccionado = 'efectivo';
        let libroCajaNube = [];

        async function cargarDatosSheet() {
            try {
                var resp = await fetch(SHEET_URL + '?action=leer');
                productosSheet = await resp.json();
                productosSheet.forEach(function(p) { stockActual[p.id] = p.stock; });
            } catch(e) {
                PRODUCTOS.forEach(function(p) { stockActual[p.id] = p.stock || 0; });
                productosSheet = PRODUCTOS;
            }
        }

        async function cargarLibroCajaNube() {
            try {
                var resp = await fetch(SHEET_URL + '?action=leerCaja');
                libroCajaNube = await resp.json();
            } catch(e) {
                libroCajaNube = [];
            }
        }

        async function guardarCajaEnNube(fecha, efectivo, transferencia, tipo) {
            try {
                await fetch(SHEET_URL + '?action=guardarCaja&fecha=' + encodeURIComponent(fecha) + '&efectivo=' + efectivo + '&transferencia=' + transferencia + '&tipo=' + tipo);
                await cargarLibroCajaNube();
            } catch(e) {}
        }

        function getProducto(id) { return productosSheet.find(function(p) { return p.id == id; }); }
        function getStock(id) { return stockActual[id] || 0; }

        function cargarDatos() {
            var hoy = new Date().toLocaleDateString();
            var cajaGuardada = JSON.parse(localStorage.getItem('ariesDrinks_caja') || '{}');
            if (!cajaGuardada.fecha) { cajaEfectivo = 0; cajaTransferencia = 0; guardarCaja(); }
            else if (cajaGuardada.fecha !== hoy) {
                if (cajaGuardada.efectivo > 0 || cajaGuardada.transferencia > 0) {
                    guardarCajaEnNube(cajaGuardada.fecha, cajaGuardada.efectivo || 0, cajaGuardada.transferencia || 0, 'cierre');
                }
                cajaEfectivo = 0; cajaTransferencia = 0; historialLocal = [];
                guardarCaja();
            } else { cajaEfectivo = cajaGuardada.efectivo || 0; cajaTransferencia = cajaGuardada.transferencia || 0; }
            historialLocal = JSON.parse(localStorage.getItem('ariesDrinks_data') || '{}').historial || [];
        }

        function guardarCaja() {
            localStorage.setItem('ariesDrinks_caja', JSON.stringify({ fecha: new Date().toLocaleDateString(), efectivo: cajaEfectivo, transferencia: cajaTransferencia }));
        }

        async function descontarStockSheet(id, cantidad) {
            try { await fetch(SHEET_URL + '?action=descontar&id=' + id + '&cantidad=' + cantidad); } catch(e) {}
        }

        async function init() {
            await cargarDatosSheet();
            await cargarLibroCajaNube();
            cargarDatos();
            cargarProductosVenta();
            document.getElementById('pagoEfectivoBox').style.display = 'block';
        }

        function filtrarProductosLocal() {
            var texto = document.getElementById('buscarProdLocal').value.toLowerCase();
            var categorias = document.querySelectorAll('#productosVenta .categoria');
            categorias.forEach(function(cat) {
                var productos = cat.querySelectorAll('.producto');
                var catVisible = false;
                productos.forEach(function(prod) {
                    var nombre = prod.querySelector('.producto-nombre').textContent.toLowerCase();
                    if (nombre.includes(texto)) { prod.style.display = 'flex'; catVisible = true; }
                    else { prod.style.display = 'none'; }
                });
                cat.style.display = catVisible ? 'block' : 'none';
                if (catVisible) cat.classList.add('abierta');
            });
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('activa'); });
            document.querySelectorAll('.seccion').forEach(function(s) { s.classList.remove('activa'); });
            if (tab === 'venta') { document.querySelectorAll('.tab')[0].classList.add('activa'); document.getElementById('seccionVenta').classList.add('activa'); cargarProductosVenta(); }
            else if (tab === 'canje') { document.querySelectorAll('.tab')[1].classList.add('activa'); document.getElementById('seccionCanje').classList.add('activa'); cargarPendientes(); }
            else { document.querySelectorAll('.tab')[2].classList.add('activa'); document.getElementById('seccionCaja').classList.add('activa'); actualizarCaja(); }
        }

        function cargarProductosVenta() {
            var container = document.getElementById('productosVenta');
            container.innerHTML = '';
            var categorias = [...new Set(productosSheet.map(function(p) { return p.categoria; }))];
            categorias.forEach(function(cat, idx) {
                var catDiv = document.createElement('div');
                catDiv.className = 'categoria' + (idx === 0 ? ' abierta' : '');
                catDiv.innerHTML = '<div class="categoria-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📌 ' + cat + '</div><div class="categoria-contenido"></div>';
                var cont = catDiv.querySelector('.categoria-contenido');
                var prodsCat = productosSheet.filter(function(p) { return p.categoria === cat; });
                var subcats = [...new Set(prodsCat.map(function(p) { return p.subcategoria || 'General'; }))];
                subcats.forEach(function(sub) {
                    var subDiv = document.createElement('div');
                    subDiv.className = 'subcategoria abierta';
                    subDiv.innerHTML = '<div class="subcategoria-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📎 ' + sub + '</div><div class="subcategoria-productos"></div>';
                    var prodDiv = subDiv.querySelector('.subcategoria-productos');
                    prodsCat.filter(function(p) { return (p.subcategoria || 'General') === sub; }).forEach(function(prod) {
                        var stock = getStock(prod.id);
                        var agotado = stock === 0;
                        var stockClass = stock > 3 ? 'stock-disponible' : (stock > 0 ? 'stock-bajo' : 'stock-agotado');
                        var stockText = stock > 3 ? 'Stock: ' + stock : (stock > 0 ? 'Poco: ' + stock : 'AGOTADO');
                        var imgSrc = (prod.imagen && prod.imagen.trim() !== '') ? prod.imagen : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="%23ddd"><rect width="40" height="40"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="18">🍽️</text></svg>';
                        prodDiv.innerHTML += '<div class="producto' + (agotado ? ' agotado' : '') + '"><img class="producto-img" src="' + imgSrc + '" alt="' + prod.nombre + '" onerror="this.style.display=\'none\'"><div class="producto-info"><div class="producto-nombre">' + prod.nombre + '</div><div class="producto-precio">$' + prod.precio + ' <span class="producto-stock ' + stockClass + '">' + stockText + '</span></div></div><div class="cantidad-control"><button class="btn-cant" onclick="cambiarCantLocal(' + prod.id + ',-1)" ' + (agotado ? 'disabled' : '') + '>-</button><span class="cantidad" id="cantL-' + prod.id + '">0</span><button class="btn-cant" onclick="cambiarCantLocal(' + prod.id + ',1)" ' + (agotado ? 'disabled' : '') + '>+</button></div></div>';
                    });
                    cont.appendChild(subDiv);
                });
                container.appendChild(catDiv);
            });
        }

        function cambiarCantLocal(id, delta) {
            if (!carritoLocal[id]) carritoLocal[id] = 0;
            var nuevo = carritoLocal[id] + delta;
            if (nuevo < 0) return;
            if (nuevo > getStock(id)) { alert('Stock insuficiente.'); return; }
            carritoLocal[id] = nuevo;
            document.getElementById('cantL-' + id).textContent = carritoLocal[id];
            actualizarTotalVenta();
        }

        function actualizarTotalVenta() {
            var total = 0;
            var detalleDiv = document.getElementById('detalleVenta');
            var html = '';
            var items = 0;
            for (var id in carritoLocal) {
                if (carritoLocal[id] > 0) {
                    var prod = getProducto(parseInt(id));
                    if (!prod) continue;
                    var subtotal = prod.precio * carritoLocal[id];
                    total += subtotal;
                    items += carritoLocal[id];
                    html += '<div class="detalle-item"><span>' + carritoLocal[id] + 'x ' + prod.nombre + '</span><span>$' + subtotal + '</span></div>';
                }
            }
            detalleDiv.innerHTML = items === 0 ? '<p style="color:#999;text-align:center;padding:10px;">Sin productos</p>' : html;
            document.getElementById('totalVenta').textContent = total;
            document.getElementById('btnCobrar').disabled = total === 0;
            calcularVuelto();
        }

        function seleccionarPago(tipo, el) {
            pagoSeleccionado = tipo;
            document.querySelectorAll('.pago-opcion').forEach(function(op) { op.classList.remove('seleccionado'); });
            el.classList.add('seleccionado');
            document.getElementById('pagoEfectivoBox').style.display = tipo === 'efectivo' ? 'block' : 'none';
            calcularVuelto();
        }

        document.getElementById('montoPagoLocal').addEventListener('input', calcularVuelto);

        function calcularVuelto() {
            var total = parseInt(document.getElementById('totalVenta').textContent) || 0;
            var pago = parseInt(document.getElementById('montoPagoLocal').value) || 0;
            var vuelto = pago - total;
            var div = document.getElementById('vueltoLocal');
            if (pago > 0 && pagoSeleccionado === 'efectivo') {
                div.innerHTML = vuelto >= 0 ? 'Vuelto: $' + vuelto : 'Falta: $' + Math.abs(vuelto);
                div.style.background = vuelto >= 0 ? '#d4edda' : '#f8d7da';
                div.style.color = vuelto >= 0 ? '#155724' : '#721c24';
            } else { div.innerHTML = 'Vuelto: $0'; div.style.background = '#d4edda'; div.style.color = '#155724'; }
        }

        function cobrarVenta() {
            var total = parseInt(document.getElementById('totalVenta').textContent) || 0;
            if (total === 0) return;
            var codigo = 'L-' + String(Math.floor(Math.random() * 9000) + 1000);
            for (var id in carritoLocal) {
                if (carritoLocal[id] > 0) {
                    stockActual[id] = (stockActual[id] || 0) - carritoLocal[id];
                    if (stockActual[id] < 0) stockActual[id] = 0;
                    descontarStockSheet(id, carritoLocal[id]);
                }
            }
            if (pagoSeleccionado === 'efectivo') { cajaEfectivo += total; } else { cajaTransferencia += total; }
            var venta = { codigo: codigo, tipo: 'local', fecha: new Date().toLocaleString(), total: total, pago: pagoSeleccionado, productos: [] };
            for (var id2 in carritoLocal) { if (carritoLocal[id2] > 0) { var prod = getProducto(parseInt(id2)); if (prod) venta.productos.push({ nombre: prod.nombre, cantidad: carritoLocal[id2], precio: prod.precio }); } }
            historialLocal.unshift(venta);
            guardarCaja();
            carritoLocal = {};
            document.getElementById('detalleVenta').innerHTML = '<p style="color:#999;text-align:center;padding:10px;">Sin productos</p>';
            document.getElementById('totalVenta').textContent = '0';
            document.getElementById('montoPagoLocal').value = '';
            document.getElementById('vueltoLocal').innerHTML = 'Vuelto: $0';
            document.getElementById('vueltoLocal').style.background = '#d4edda';
            document.getElementById('btnCobrar').disabled = true;
            cargarProductosVenta();
            actualizarCaja();
            alert('✅ Venta registrada: ' + codigo + '\nTotal: $' + total);
        }

        function cargarPendientes() {
            var pendientes = JSON.parse(localStorage.getItem('pendientesDelivery') || '[]');
            var div = document.getElementById('listaPendientes');
            if (pendientes.length === 0) { div.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">No hay pedidos pendientes</p>'; return; }
            var html = '';
            pendientes.forEach(function(ped, index) {
                var prodsTexto = ped.productos.filter(function(pr) { return pr.precio > 0; }).map(function(pr) { return pr.cantidad + 'x ' + pr.nombre; }).join(', ');
                html += '<div class="pendiente-item"><strong>🎫 #' + ped.codigo + '</strong> | ' + ped.fecha + '<br>👤 ' + ped.cliente + ' | 📞 ' + ped.telefono + '<br>📍 ' + ped.direccion + ' | 🚚 ' + ped.zona + '<br>📦 ' + prodsTexto + '<br>💵 Total: $' + ped.total + ' | 💳 ' + (ped.pago === 'efectivo' ? 'Efectivo' : 'Transferencia') + '<br><button class="btn-confirmar" style="margin-top:8px;width:100%;" onclick="confirmarPedido(' + index + ')">✅ CONFIRMAR Y DESCONTAR STOCK</button></div>';
            });
            div.innerHTML = html;
        }

        function confirmarPedido(index) {
            cargarDatos();
            var pendientes = JSON.parse(localStorage.getItem('pendientesDelivery') || '[]');
            var ped = pendientes[index];
            if (!ped) return;
            if (!confirm('¿Confirmar pedido #' + ped.codigo + ' por $' + ped.total + '?')) return;
            ped.productos.forEach(function(pr) {
                stockActual[pr.id] = (stockActual[pr.id] || 0) - pr.cantidad;
                if (stockActual[pr.id] < 0) stockActual[pr.id] = 0;
                descontarStockSheet(pr.id, pr.cantidad);
            });
            if (ped.pago === 'efectivo') { cajaEfectivo += ped.total; } else { cajaTransferencia += ped.total; }
            historialLocal.unshift({ codigo: ped.codigo, tipo: 'delivery', fecha: new Date().toLocaleString(), cliente: ped.cliente, total: ped.total, pago: ped.pago, productos: ped.productos });
            pendientes.splice(index, 1);
            localStorage.setItem('pendientesDelivery', JSON.stringify(pendientes));
            guardarCaja();
            cargarPendientes();
            cargarProductosVenta();
            actualizarCaja();
            alert('✅ Pedido #' + ped.codigo + ' confirmado.');
        }

        function actualizarCaja() {
            cargarDatos();
            document.getElementById('cajaEfectivo').textContent = cajaEfectivo;
            document.getElementById('cajaTransferencia').textContent = cajaTransferencia;
            document.getElementById('cajaTotal').textContent = cajaEfectivo + cajaTransferencia;
            var div = document.getElementById('listaHistorial');
            if (historialLocal.length === 0) { div.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Sin ventas</p>'; return; }
            var html = '';
            historialLocal.slice(0, 20).forEach(function(h) { html += '<div class="historial-item"><span>#' + h.codigo + ' | ' + (h.tipo === 'local' ? '🏠' : '🛵') + ' | ' + (h.pago === 'efectivo' ? '💵' : '🏦') + '</span><strong>$' + h.total + '</strong></div>'; });
            div.innerHTML = html;

            var libroDiv = document.getElementById('listaLibroCaja');
            if (!libroCajaNube || libroCajaNube.length === 0) {
                libroDiv.innerHTML = '<p style="color:#999;text-align:center;padding:10px;">Sin registros en la nube</p>';
            } else {
                var libroHtml = '';
                libroCajaNube.slice(0, 10).forEach(function(d) {
                    libroHtml += '<div class="historial-item"><span>📅 ' + d.fecha + '</span><span>💵 $' + d.efectivo + ' | 🏦 $' + d.transferencia + ' | <strong>$' + d.total + '</strong></span></div>';
                });
                libroDiv.innerHTML = libroHtml;
            }
        }

        async function reiniciarCaja() {
            if (confirm('¿Forzar nuevo día? Se guardará en la nube.')) {
                var hoy = new Date().toLocaleDateString();
                await guardarCajaEnNube(hoy, cajaEfectivo, cajaTransferencia, 'cierre');
                cajaEfectivo = 0; cajaTransferencia = 0; historialLocal = [];
                guardarCaja(); actualizarCaja();
                alert('✅ Caja reiniciada y guardada en la nube.');
            }
        }

        init();
    </script>
