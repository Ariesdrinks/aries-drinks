<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery - Aries Drinks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: #e74c3c; color: white; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 15px; }
        .header img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid white; }
        .header h1 { font-size: 22px; }
        .categoria { background: white; margin-bottom: 8px; border-radius: 10px; overflow: hidden; }
        .categoria-titulo { background: #e74c3c; color: white; padding: 14px 15px; font-size: 17px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .categoria.abierta .categoria-contenido { display: block; }
        .categoria-contenido { display: none; }
        .subcategoria-titulo { background: #fdf2f2; padding: 10px 15px; font-size: 14px; font-weight: bold; color: #c0392b; cursor: pointer; }
        .subcategoria.abierta .subcategoria-productos { display: block; }
        .subcategoria-productos { display: none; padding: 5px 10px; }
        .producto { display: flex; align-items: center; padding: 8px 5px; border-bottom: 1px solid #f5f5f5; gap: 8px; }
        .producto.agotado { opacity: 0.5; }
        .producto-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .producto-info { flex: 1; min-width: 0; }
        .producto-nombre { font-weight: bold; font-size: 14px; }
        .producto-descripcion { color: #666; font-size: 11px; }
        .producto-precio { color: #e74c3c; font-weight: bold; font-size: 14px; }
        .producto-stock { font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
        .stock-disponible { background: #d4edda; color: #155724; }
        .stock-bajo { background: #fff3cd; color: #856404; }
        .stock-agotado { background: #f8d7da; color: #721c24; }
        .combo-badge { background: #f39c12; color: white; font-size: 10px; padding: 2px 6px; border-radius: 8px; margin-left: 5px; }
        .cantidad-control { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .btn-cant { background: #e74c3c; color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 15px; cursor: pointer; }
        .btn-cant:disabled { background: #ccc; }
        .cantidad { min-width: 18px; text-align: center; font-weight: bold; font-size: 13px; }
        .seccion { background: white; padding: 18px; margin-bottom: 12px; border-radius: 10px; }
        .seccion h3 { color: #e74c3c; margin-bottom: 12px; font-size: 17px; }
        input, select, textarea { width: 100%; padding: 11px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .total { font-size: 20px; font-weight: bold; color: #e74c3c; text-align: right; margin: 12px 0; }
        .envio-linea { font-size: 14px; color: #666; text-align: right; }
        .btn-enviar { background: #25D366; color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn-enviar:disabled { background: #ccc; }
        .btn-wpp-alt { background: #128C7E; color: white; border: none; padding: 12px; border-radius: 25px; font-size: 14px; width: 100%; cursor: pointer; margin-top: 8px; display: none; }
        .aviso-wpp { background: #fff9e6; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; display: none; border: 2px solid #f39c12; }
        .pago-opcion { display: block; padding: 10px 15px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 6px; cursor: pointer; font-size: 15px; }
        .pago-opcion input { width: auto; margin-right: 8px; }
        .vuelto-box { background: #fff9e6; padding: 10px; border-radius: 8px; margin-top: 6px; }
        .carrito-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .carrito-vacio { color: #999; text-align: center; padding: 15px; }
        .envio-detalle { background: #f0f8ff; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 14px; text-align: center; color: #2c3e50; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.jpeg" alt="Aries Drinks" onerror="this.style.display='none'">
            <h1 id="nombreLocal">Cargando...</h1>
            <p>🛵 Delivery</p>
        </div>
        <div id="productosContainer"></div>
        <div class="seccion">
            <h3>🛒 Tu Pedido</h3>
            <div id="carritoItems"></div>
            <div class="envio-linea" id="envioLinea"></div>
            <div class="total">Total: $<span id="totalCarrito">0</span></div>
        </div>
        <div class="seccion">
            <h3>📍 Datos de Envío</h3>
            <select id="zonaEnvio"><option value="">Seleccioná tu barrio...</option></select>
            <div class="envio-detalle" id="envioDetalle"></div>
            <input type="text" id="nombreCliente" placeholder="Tu nombre completo *">
            <input type="text" id="direccionCliente" placeholder="Dirección completa *">
            <input type="text" id="telefonoCliente" placeholder="Teléfono de contacto *">
            <textarea id="observaciones" placeholder="Referencias" rows="2"></textarea>
        </div>
        <div class="seccion">
            <h3>💳 Medio de Pago</h3>
            <label class="pago-opcion"><input type="radio" name="pago" value="efectivo" checked> 💵 Efectivo</label>
            <div id="vueltoBox" class="vuelto-box">
                <label>¿Con cuánto vas a pagar?</label>
                <input type="number" id="montoPago" placeholder="Ej: 5000">
                <div id="vueltoCalculado"></div>
            </div>
            <label class="pago-opcion"><input type="radio" name="pago" value="transferencia"> 🏦 Transferencia Bancaria</label>
        </div>
        <button class="btn-enviar" id="btnEnviar" disabled>📱 Enviar Pedido por WhatsApp</button>
        <div class="aviso-wpp" id="avisoWpp">
            <p>⚠️ <strong>¿No se abrió WhatsApp?</strong></p>
            <p>Tu pedido ya fue registrado. Mandanos un mensaje con tu nombre al WhatsApp del local para confirmar.</p>
            <button class="btn-wpp-alt" id="btnWppAlt">📱 Abrir WhatsApp ahora</button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzIpLnLiAZmwzMsGCUJPXgeoYmvVoD5lb5xOA2mxGojXC6FwY7wM2_3bqqF1_sYQuzBhg/exec';
        
        document.getElementById('nombreLocal').textContent = CONFIG.nombreLocal;
        let carrito = {};
        let productosSheet = [];
        let stockActual = {};

        async function cargarDatosSheet() {
            try {
                var resp = await fetch(SHEET_URL + '?action=leer');
                productosSheet = await resp.json();
                productosSheet.forEach(function(p) { stockActual[p.id] = p.stock; });
            } catch(e) {
                PRODUCTOS.forEach(function(p) { stockActual[p.id] = p.stock || 0; });
                productosSheet = PRODUCTOS;
            }
        }

        function getProducto(id) { return productosSheet.find(function(p) { return p.id == id; }); }

        function getStock(id) {
            var prod = getProducto(id);
            if (prod && prod.esCombo) {
                var minStock = Infinity;
                if (prod.productos) {
                    var partes = String(prod.productos).split(',');
                    for (var i = 0; i < partes.length; i++) {
                        var p = partes[i].split(':');
                        if (p.length >= 2) {
                            var s = stockActual[parseInt(p[0])] || 0;
                            var posible = Math.floor(s / parseInt(p[1]));
                            if (posible < minStock) minStock = posible;
                        }
                    }
                }
                return Math.min(minStock, prod.stock || Infinity);
            }
            return stockActual[id] || 0;
        }

        function nombreCompleto(prod) { return prod.nombre + (prod.descripcion ? ' ' + prod.descripcion : ''); }

        async function cargarProductos() {
            await cargarDatosSheet();
            var container = document.getElementById('productosContainer');
            container.innerHTML = '';
            var categorias = [...new Set(productosSheet.map(p => p.categoria))];
            categorias.forEach((cat, idx) => {
                var catDiv = document.createElement('div');
                catDiv.className = 'categoria' + (idx === 0 ? ' abierta' : '');
                catDiv.innerHTML = '<div class="categoria-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📌 ' + cat + '</div><div class="categoria-contenido"></div>';
                var cont = catDiv.querySelector('.categoria-contenido');
                var prodsCat = productosSheet.filter(p => p.categoria === cat);
                var subcats = [...new Set(prodsCat.map(p => p.subcategoria || 'General'))];
                subcats.forEach((sub) => {
                    var subDiv = document.createElement('div');
                    subDiv.className = 'subcategoria abierta';
                    subDiv.innerHTML = '<div class="subcategoria-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📎 ' + sub + '</div><div class="subcategoria-productos"></div>';
                    var prodDiv = subDiv.querySelector('.subcategoria-productos');
                    prodsCat.filter(p => (p.subcategoria || 'General') === sub).forEach(prod => {
                        var stock = getStock(prod.id);
                        var agotado = stock === 0;
                        var stockClass = stock > 3 ? 'stock-disponible' : (stock > 0 ? 'stock-bajo' : 'stock-agotado');
                        var stockText = stock > 3 ? 'Stock: ' + stock : (stock > 0 ? '¡Últimas ' + stock + '!' : 'AGOTADO');
                        var comboBadge = prod.esCombo ? '<span class="combo-badge">COMBO</span>' : '';
                        var imgSrc = (prod.imagen && prod.imagen.trim() !== '') ? prod.imagen : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="%23ddd"><rect width="50" height="50"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="22">🍽️</text></svg>';
                        prodDiv.innerHTML += '<div class="producto' + (agotado ? ' agotado' : '') + '">' +
                            '<img class="producto-img" src="' + imgSrc + '" alt="' + prod.nombre + '" onerror="this.style.display=\'none\'">' +
                            '<div class="producto-info"><div class="producto-nombre">' + prod.nombre + comboBadge + '</div>' +
                            (prod.descripcion ? '<div class="producto-descripcion">' + prod.descripcion + '</div>' : '') +
                            '<div class="producto-precio">$' + prod.precio + ' <span class="producto-stock ' + stockClass + '">' + stockText + '</span></div></div>' +
                            '<div class="cantidad-control"><button class="btn-cant" onclick="cambiarCant(' + prod.id + ',-1)" ' + (agotado ? 'disabled' : '') + '>-</button>' +
                            '<span class="cantidad" id="cant-' + prod.id + '">0</span>' +
                            '<button class="btn-cant" onclick="cambiarCant(' + prod.id + ',1)" ' + (agotado ? 'disabled' : '') + '>+</button></div></div>';
                    });
                    cont.appendChild(subDiv);
                });
                container.appendChild(catDiv);
            });
        }

        function cambiarCant(id, delta) {
            if (!carrito[id]) carrito[id] = 0;
            var nuevo = carrito[id] + delta;
            if (nuevo < 0) return;
            if (nuevo > getStock(id)) { alert('Stock insuficiente.'); return; }
            carrito[id] = nuevo;
            document.getElementById('cant-' + id).textContent = carrito[id];
            actualizarCarrito();
        }

        function getEnvioActual() {
            var val = document.getElementById('zonaEnvio').value;
            return val ? parseInt(val.split('|')[0]) : 0;
        }

        function actualizarCarrito() {
            var div = document.getElementById('carritoItems');
            var total = 0, html = '', items = 0;
            for (var id in carrito) {
                if (carrito[id] > 0) {
                    var prod = getProducto(parseInt(id));
                    if (!prod) continue;
                    total += prod.precio * carrito[id];
                    items += carrito[id];
                    html += '<div class="carrito-item"><span>' + carrito[id] + 'x ' + nombreCompleto(prod) + '</span><span>$' + (prod.precio * carrito[id]) + '</span></div>';
                }
            }
            div.innerHTML = items === 0 ? '<div class="carrito-vacio">No hay productos</div>' : html;
            var envio = getEnvioActual();
            var totalConEnvio = total + envio;
            document.getElementById('totalCarrito').textContent = totalConEnvio;
            document.getElementById('envioLinea').textContent = (envio > 0 && items > 0) ? 'Productos: $' + total + ' + Envío: $' + envio : '';
            validar();
        }

        CONFIG.zonasEnvio.forEach(z => {
            document.getElementById('zonaEnvio').innerHTML += '<option value="' + z.precio + '|' + z.nombre + '">' + z.nombre + '</option>';
        });

        document.getElementById('zonaEnvio').addEventListener('change', function() {
            var v = this.value, d = document.getElementById('envioDetalle');
            if (v) { var p = v.split('|'); d.textContent = '🚚 Envío a ' + p[1] + ': $' + p[0]; d.style.display = 'block'; }
            else { d.style.display = 'none'; }
            actualizarCarrito();
        });

        document.getElementById('montoPago').addEventListener('input', function() {
            var total = parseInt(document.getElementById('totalCarrito').textContent);
            var pago = parseInt(this.value) || 0;
            document.getElementById('vueltoCalculado').innerHTML = pago > 0 ? (pago >= total ? '<strong style="color:green">Vuelto: $' + (pago - total) + '</strong>' : '<strong style="color:red">Falta dinero</strong>') : '';
            validar();
        });

        document.querySelectorAll('input[name="pago"]').forEach(r => {
            r.addEventListener('change', function() {
                document.getElementById('vueltoBox').style.display = this.value === 'efectivo' ? 'block' : 'none';
                validar();
            });
        });

        ['nombreCliente','direccionCliente','telefonoCliente'].forEach(id => {
            document.getElementById(id).addEventListener('input', validar);
        });

        function validar() {
            var total = parseInt(document.getElementById('totalCarrito').textContent);
            var efvo = document.querySelector('input[name="pago"]:checked').value === 'efectivo';
            var pago = parseInt(document.getElementById('montoPago').value) || 0;
            var envio = getEnvioActual();
            var ok = total > 0 && envio > 0 && document.getElementById('nombreCliente').value.trim() && 
                     document.getElementById('direccionCliente').value.trim() && 
                     document.getElementById('telefonoCliente').value.trim();
            if (efvo) ok = ok && pago >= total;
            document.getElementById('btnEnviar').disabled = !ok;
        }

        async function guardarPendienteEnSheet(codigo, fecha, cliente, telefono, direccion, zona, productos, total, pago) {
            try {
                await fetch(SHEET_URL + '?action=guardarPendiente&codigo=' + encodeURIComponent(codigo) + '&fecha=' + encodeURIComponent(fecha) + '&cliente=' + encodeURIComponent(cliente) + '&telefono=' + encodeURIComponent(telefono) + '&direccion=' + encodeURIComponent(direccion) + '&zona=' + encodeURIComponent(zona) + '&productos=' + encodeURIComponent(productos) + '&total=' + total + '&pago=' + pago);
            } catch(e) {}
        }

        document.getElementById('btnEnviar').addEventListener('click', async function() {
            var zonaVal = document.getElementById('zonaEnvio').value, parts = zonaVal.split('|');
            var maxCod = Math.floor(Math.random() * 9000) + 1000;
            var codigo = 'AR-' + String(maxCod).padStart(3, '0');
            var subt = 0, prodsTexto = '';
            for (var id in carrito) {
                if (carrito[id] > 0) {
                    var p = getProducto(parseInt(id));
                    if (!p) continue;
                    subt += p.precio * carrito[id];
                    prodsTexto += carrito[id] + 'x ' + nombreCompleto(p) + ', ';
                }
            }
            var env = parseInt(parts[0]), total = subt + env;
            var pago = document.querySelector('input[name="pago"]:checked').value;

            await guardarPendienteEnSheet(codigo, new Date().toLocaleString(), document.getElementById('nombreCliente').value, document.getElementById('telefonoCliente').value, document.getElementById('direccionCliente').value, parts[1], prodsTexto, total, pago);

            var msg = '🛵 *NUEVO PEDIDO - ARIES DRINKS*\n\n🎫 *CÓDIGO: #' + codigo + '*\n📦 *ESTADO: PENDIENTE*\n\n👤 *Cliente:* ' + document.getElementById('nombreCliente').value + '\n📞 *Tel:* ' + document.getElementById('telefonoCliente').value + '\n📍 *Dir:* ' + document.getElementById('direccionCliente').value + '\n🚚 *Envío a ' + parts[1] + ':* $' + parts[0] + '\n';
            var obs = document.getElementById('observaciones').value.trim();
            if (obs) msg += '📝 *Obs:* ' + obs + '\n';
            msg += '\n📋 *PEDIDO:*\n' + prodsTexto.replace(/, $/, '').split(', ').map(function(line) { return '- ' + line; }).join('\n');
            msg += '\n\n💰 Subtotal: $' + subt + '\n🚚 Envío: $' + env + '\n💵 *TOTAL: $' + total + '*\n💳 *Pago:* ' + (pago === 'efectivo' ? 'Efectivo' : 'Transferencia');
            if (pago === 'efectivo') { var monto = document.getElementById('montoPago').value; msg += '\n💵 Paga con: $' + monto + '\n🔄 Vuelto: $' + (monto - total); }
            
            carrito = {}; actualizarCarrito(); cargarProductos();
            
            window.open('https://wa.me/' + CONFIG.telefono + '?text=' + encodeURIComponent(msg), '_blank');
            
            document.getElementById('avisoWpp').style.display = 'block';
            document.getElementById('btnWppAlt').onclick = function() {
                window.open('https://wa.me/' + CONFIG.telefono + '?text=' + encodeURIComponent(msg), '_blank');
            };
        });

        cargarProductos();
        actualizarCarrito();
    </script>
</body>
</html>
