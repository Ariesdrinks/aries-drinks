<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Aries Drinks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 15px; text-align: center; width: 350px; }
        .login-box img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .login-box button { background: #e74c3c; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        .admin-box { background: white; padding: 25px; border-radius: 15px; width: 95%; max-width: 950px; display: none; max-height: 90vh; overflow-y: auto; }
        .admin-logo { text-align: center; margin-bottom: 10px; }
        .admin-logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .admin-box h2 { color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; margin-bottom: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab { padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; background: #eee; color: #666; border: none; }
        .tab.activa { background: #e74c3c; color: white; }
        .seccion-admin { display: none; }
        .seccion-admin.activa { display: block; }
        .form-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .form-row input, .form-row select { flex: 1; min-width: 130px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #e74c3c; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.9; }
        .btn-verde { background: #27ae60; }
        .btn-azul { background: #2980b9; }
        .btn-gris { background: #95a5a6; }
        .btn-rojo { background: #c0392b; padding: 5px 12px; font-size: 12px; }
        .btn-naranja { background: #e67e22; padding: 5px 12px; font-size: 12px; }
        .categoria-admin { background: #f9f9f9; margin-bottom: 8px; border-radius: 10px; overflow: hidden; }
        .categoria-admin-titulo { background: #e74c3c; color: white; padding: 12px 15px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .categoria-admin.abierta .categoria-admin-contenido { display: block; }
        .categoria-admin-contenido { display: none; }
        .subcategoria-admin { border-top: 1px solid #eee; }
        .subcategoria-admin-titulo { background: #fdf2f2; padding: 10px 15px; font-size: 14px; font-weight: bold; color: #c0392b; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .subcategoria-admin.abierta .subcategoria-admin-productos { display: block; }
        .subcategoria-admin-productos { display: none; padding: 5px 10px; }
        .producto-item { background: white; padding: 10px; margin: 4px 0; border-radius: 8px; border-left: 4px solid #e74c3c; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .producto-item .info { flex: 1; min-width: 180px; }
        .producto-item .info strong { font-size: 14px; }
        .producto-item .info small { display: block; color: #666; font-size: 12px; }
        .producto-item .acciones { display: flex; gap: 5px; }
        .stock-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .stock-alto { background: #d4edda; color: #155724; }
        .stock-medio { background: #fff3cd; color: #856404; }
        .stock-bajo { background: #f8d7da; color: #721c24; }
        .barrio-item { background: #f0f8ff; padding: 10px 15px; margin: 5px 0; border-radius: 8px; border-left: 4px solid #2980b9; display: flex; justify-content: space-between; align-items: center; }
        textarea { width: 100%; height: 200px; font-family: monospace; margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-contenido { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-contenido h3 { margin-bottom: 15px; color: #e74c3c; }
        .modal-contenido input, .modal-contenido select { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; }
        .modal-acciones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px; }
        .busqueda { margin-bottom: 15px; }
        .busqueda input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; font-size: 15px; }
        .aviso-sync { background: #d4edda; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; color: #155724; font-weight: bold; }
        .sin-resultados { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-box">
        <img src="img/logo.jpeg" alt="Aries Drinks" onerror="this.style.display='none'">
        <h2>🔐 Panel Admin</h2>
        <h3 style="color:#e74c3c;">Aries Drinks</h3>
        <input type="password" id="passInput" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <p id="error" style="color:red;display:none;margin-top:10px;">Contraseña incorrecta</p>
    </div>

    <div id="adminScreen" class="admin-box">
        <div class="admin-logo"><img src="img/logo.jpeg" alt="Aries Drinks" onerror="this.style.display='none'"></div>
        <h2>📊 Panel de Administración</h2>
        <div class="aviso-sync">✅ Datos sincronizados con Google Sheets</div>
        <div class="tabs">
            <button class="tab activa" onclick="cambiarTab('productos')">📦 Productos</button>
            <button class="tab" onclick="cambiarTab('barrios')">🚚 Barrios</button>
        </div>

        <div id="seccionProductos" class="seccion-admin activa">
            <div class="busqueda"><input type="text" id="buscarProd" placeholder="🔍 Buscar producto..." oninput="filtrar()"></div>
            <div id="listaCategorias"></div>
        </div>

        <div id="seccionBarrios" class="seccion-admin">
            <h3>🚚 Barrios: <span id="cantBarrios">0</span></h3>
            <div class="form-row">
                <input type="text" id="nombreBarrio" placeholder="Nombre *">
                <input type="number" id="precioBarrio" placeholder="Precio $ *">
                <button class="btn-azul" onclick="agregarBarrio()">+</button>
            </div>
            <div id="listaBarrios"></div>
        </div>
        <br><button class="btn-gris" onclick="logout()">🚪 Cerrar Sesión</button>
    </div>

    <script src="js/config.js"></script>
    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzcZRKmUEQikaxq3vfrdeeDNsyk_f-ZhWvY-El_VJCpX_tRErtBGfYZ1ibtX6auP0VS6A/exec';
        let prods = [];
        let barrios = [];

        async function cargarDatos() {
            try {
                var resp = await fetch(SHEET_URL + '?action=leer');
                prods = await resp.json();
            } catch(e) {
                prods = PRODUCTOS.map(function(p) { return { id: p.id, nombre: p.nombre, categoria: p.categoria, subcategoria: p.subcategoria, descripcion: p.descripcion, precio: p.precio, stock: p.stock, imagen: p.imagen }; });
            }
            barrios = CONFIG.zonasEnvio.map(function(b) { return { nombre: b.nombre, precio: b.precio }; });
        }

        async function sincronizarStock(id, stock) {
            try { await fetch(SHEET_URL + '?action=actualizar&id=' + id + '&stock=' + stock); } catch(e) {}
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('activa'); });
            document.querySelectorAll('.seccion-admin').forEach(function(s) { s.classList.remove('activa'); });
            if (tab === 'productos') { document.querySelectorAll('.tab')[0].classList.add('activa'); document.getElementById('seccionProductos').classList.add('activa'); }
            else { document.querySelectorAll('.tab')[1].classList.add('activa'); document.getElementById('seccionBarrios').classList.add('activa'); }
        }

        function login() {
            if (document.getElementById('passInput').value === CONFIG.passwordAdmin) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminScreen').style.display = 'block';
                init();
            } else { document.getElementById('error').style.display = 'block'; }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminScreen').style.display = 'none';
        }

        async function init() { await cargarDatos(); actualizarProductos(); actualizarBarrios(); }

        function filtrar() { actualizarProductos(); }

        function actualizarProductos() {
            var container = document.getElementById('listaCategorias');
            var texto = document.getElementById('buscarProd').value.toLowerCase();
            var prodsFiltrados = texto ? prods.filter(function(p) { return p.nombre.toLowerCase().includes(texto) || p.categoria.toLowerCase().includes(texto); }) : prods;
            var categorias = [...new Set(prodsFiltrados.map(function(p) { return p.categoria; }))];
            if (categorias.length === 0) { container.innerHTML = '<div class="sin-resultados">No se encontraron productos</div>'; return; }
            var html = '';
            categorias.forEach(function(cat) {
                var prodsCat = prodsFiltrados.filter(function(p) { return p.categoria === cat; });
                var subcats = [...new Set(prodsCat.map(function(p) { return p.subcategoria || 'General'; }))];
                html += '<div class="categoria-admin abierta"><div class="categoria-admin-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📌 ' + cat + ' (' + prodsCat.length + ')</div><div class="categoria-admin-contenido">';
                subcats.forEach(function(sub) {
                    var prodsSub = prodsCat.filter(function(p) { return (p.subcategoria || 'General') === sub; });
                    html += '<div class="subcategoria-admin abierta"><div class="subcategoria-admin-titulo" onclick="this.parentElement.classList.toggle(\'abierta\')">📎 ' + sub + ' (' + prodsSub.length + ')</div><div class="subcategoria-admin-productos">';
                    prodsSub.forEach(function(p) {
                        var stockClass = p.stock > 5 ? 'stock-alto' : (p.stock > 0 ? 'stock-medio' : 'stock-bajo');
                        var stockText = p.stock > 5 ? 'Stock: ' + p.stock : (p.stock > 0 ? 'Poco: ' + p.stock : 'AGOTADO');
                        html += '<div class="producto-item"><div class="info"><strong>' + p.nombre + '</strong><small>' + (p.descripcion || '') + ' | 🖼️ ' + (p.imagen ? 'Sí' : 'No') + '</small><strong style="color:#e74c3c;">$' + p.precio + '</strong> <span class="stock-badge ' + stockClass + '">' + stockText + '</span></div><div class="acciones"><input type="number" value="' + p.stock + '" style="width:60px;padding:4px;margin-right:4px;" onchange="cambiarStock(' + p.id + ', this.value)"><button class="btn-azul" onclick="sincronizarStock(' + p.id + ', ' + p.stock + ')">💾</button></div></div>';
                    });
                    html += '</div></div>';
                });
                html += '</div></div>';
            });
            container.innerHTML = html;
        }

        function cambiarStock(id, valor) {
            var nuevo = parseInt(valor) || 0;
            var prod = prods.find(function(p) { return p.id == id; });
            if (prod) prod.stock = nuevo;
            sincronizarStock(id, nuevo);
        }

        function agregarBarrio() {
            var n = document.getElementById('nombreBarrio').value.trim();
            var p = parseInt(document.getElementById('precioBarrio').value);
            if (n && p) { barrios.push({ nombre: n, precio: p }); barrios.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); }); document.getElementById('nombreBarrio').value=''; document.getElementById('precioBarrio').value=''; actualizarBarrios(); }
        }

        function eliminarBarrio(i) { if(confirm('Eliminar?')) { barrios.splice(i,1); actualizarBarrios(); } }

        function actualizarBarrios() {
            document.getElementById('cantBarrios').textContent = barrios.length;
            var h = '';
            barrios.forEach(function(b,i){ h += '<div class="barrio-item"><div class="info"><strong>📍 '+b.nombre+'</strong> - $'+b.precio+'</div><button class="btn-rojo" onclick="eliminarBarrio('+i+')">🗑️</button></div>'; });
            document.getElementById('listaBarrios').innerHTML = h || '<p>No hay barrios</p>';
        }
    </script>
</body>
</html>
